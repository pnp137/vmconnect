# Air configuration for hot reload
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./main.go"
  delay = 1000
  exclude = ["*.sum", "*.sql", "*.md", "build/", "docs/", "bruno/", "logs/"]
  exclude_dir = ["assets", "tmp", "vendor", "build", "docs", "bruno", "logs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  full_bin = ""
  full_path = ""
  include_dir = []
  include_ext = ["go"]
  include_file = []
  include_regex = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
