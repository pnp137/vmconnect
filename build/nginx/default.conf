upstream vmconnect-api {
    server vmconnect-api:8080;
}

server {
    listen       80;
    server_name  localhost;
    
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    location / {
        # Timeout for transmitting a response to client. If the client does not
        # receive any response within this time, connection is closed
        send_timeout                20;

        # Timeout for establishing connection with the proxied server
        proxy_connect_timeout       60s;

        # Timeout for transmitting a request to the proxied server.
        # If the proxied server does not receive anything within this time, the connection is closed.
        proxy_send_timeout          15s;

        # Timeout for reading a response from proxied server.
        # If the proxied server does not transmit anything within this time, the connection is closed
        proxy_read_timeout          20s;

        # WebSocket support
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection 'upgrade';
        proxy_cache_bypass      $http_upgrade;

        # Standard proxy headers
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Host $host;
        proxy_set_header        X-Forwarded-Port $server_port;

        # Proxy to VMConnect API
        proxy_pass              http://vmconnect-api;

        # HTTP version and buffering
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://vmconnect-api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (if any)
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}